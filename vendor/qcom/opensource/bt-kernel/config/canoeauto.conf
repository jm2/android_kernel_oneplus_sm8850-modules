# Canoe (SM8850) bt-kernel CONFIG export.
#
# Pattern mirrors audio-kernel/config/canoeauto.conf (sub-wave 2C).
# Sourced from bt-kernel/Kbuild under `ifeq ($(CONFIG_ARCH_CANOE), y)`.
# Sets the Make-side CONFIG variables that bt-kernel/Kbuild's
# obj-$() and ifeq() rules consume; bt-kernel/Kbuild's existing
# `KBUILD_CPPFLAGS += -DCONFIG_X` blocks then mirror these to
# C-side defines so #ifdef / IS_ENABLED gates evaluate correctly.

export CONFIG_MSM_BT_POWER=m
export CONFIG_BTFM_CODEC=m
export CONFIG_SLIM_BTFM_CODEC=m
export CONFIG_BTFM_SWR=m

# CONFIG_FMD_ENABLE matches OEM target.bzl define_canoe(); enables
# FM-power-control code paths in pwr/btpower.c. Without this, our
# btpower.ko diverges from OEM's (size delta + FMD-related symbols
# missing). Step 7.8c name-collision verification would flag this
# pre-flash via modinfo+size check.
export CONFIG_FMD_ENABLE=y
