# canoe per-target eva-kernel CONFIG exports.
# Mirrors canoe.bzl's define_canoe() config_options list. Sourced from
# eva-kernel/Kbuild's `ifeq ($(CONFIG_ARCH_CANOE), y)` gate.

# Base module enable
export CONFIG_MSM_EVA=m

# SoC variant identifier (consumed by msm/Kbuild's per-arch block to
# add -DCONFIG_EVA_CANOE=1 + sibling-tree include paths)
export CONFIG_EVA_CANOE=y

# Feature gates per canoe.bzl
export TARGET_SYNX_ENABLE=y
export TARGET_DSP_ENABLE=y
export TARGET_MMRM_ENABLE=y
export CONFIG_MSM_MMRM=y
